<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account | StyleMarket</title>

    <link rel="stylesheet" href="../CSS/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body class="homepage-body">
    <!-- ACCOUNT PAGE -->

    <!-- GLOBAL SEARCH PANEL -->

    <div id="searchPanel" class="search-panel">
      <div class="search-header">
        <input id="searchInput" placeholder="Search..." />
        <span class="close-btn" onclick="closeSearch()">×</span>
      </div>

      <div class="recent-searches">
        <div class="recent-header">
          <h4>Recent Searches</h4>
          <button onclick="clearRecentSearches()">Clear All</button>
        </div>
        <div id="recentList"></div>
      </div>

      <div id="searchResults"></div>
    </div>

    <!-- MAIN NAVIGATION BAR -->

    <header>
      <nav class="nav-container">
        <div class="nav-logo">
          <a href="homepage.html">StyleMarket</a>
        </div>

        <!-- CATEGORY NAVIGATION LINKS -->

        <ul class="nav-left">
          <li><a href="women.html">Women</a></li>
          <li><a href="men.html">Men</a></li>
          <li><a href="shoes.html">Shoes</a></li>
          <li><a href="accessories.html">Accessories</a></li>
          <li><a href="sell.html">Sell</a></li>
        </ul>

        <ul class="nav-right">
          <li class="icon">
            <a href="#" onclick="openSearch()" title="Search">
              <i class="fas fa-search"></i>
            </a>
          </li>

          <li class="icon">
            <a href="account.html" id="accountIcon" title="Account">
              <i class="fas fa-user"></i>
            </a>
          </li>

          <li class="icon">
            <a href="wishlist.html" title="Wishlist">
              <i class="fas fa-heart"></i>
            </a>
          </li>

          <li class="icon">
            <a href="cart.html" class="cart-icon" title="Cart">
              <i class="fas fa-shopping-cart"></i>
              <span id="cartCount" class="cart-count">0</span>
            </a>
          </li>

          <li>
            <a href="../index.html" class="account-btn" id="authBtn">Log In</a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- ACCOUNT CONTENT -->

    <main class="account-page">
      <h1>My Account</h1>

      <div class="account-grid">
        <!-- USER PROFILE SECTION -->

        <div class="account-card">
          <h2>Profile</h2>

          <input id="fullName" placeholder="Full Name" />
          <input id="email" placeholder="Email" />
          <input id="phone" placeholder="Phone Number" />
          <input id="address" placeholder="Address" />

          <button onclick="saveProfile()" class="save-btn">Save Profile</button>
          <button onclick="logoutUser()" class="logout-btn">Log Out</button>
        </div>

        <!-- ORDER HISTORY SECTION -->

        <div class="account-card">
          <h2>Order History</h2>
          <div id="orderHistory"></div>
        </div>
      </div>
    </main>

    <script type="module">
      import { auth, db } from "../js/firebase.js";

      import {
        doc,
        setDoc,
        getDoc,
        collection,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      // ORDER HISTORY DISPLAY
      const orderHistory = document.getElementById("orderHistory");

      async function loadOrders(userId) {
        const snapshot = await getDocs(
          collection(db, "users", userId, "orders"),
        );

        const orders = [];

        snapshot.forEach((doc) => {
          orders.push(doc.data());
        });

        if (orders.length === 0) {
          orderHistory.innerHTML =
            "<p class='no-orders'>You have no orders yet.</p>";

          return;
        }

        orderHistory.innerHTML = orders
          .map(
            (order) => `
        <div class="order-item">
          <p><strong>Order Date:</strong> ${order.date}</p>
          <p><strong>Total:</strong> $${order.total}</p>
          <p><strong>Items:</strong> ${
            order.items
              ? order.items
                  .map((item) => item.name + " x" + item.quantity)
                  .join(", ")
              : "No item details"
          }</p>
        </div>
      `,
          )
          .join("");
      }

      // PROFILE SAVING
      window.saveProfile = async function () {
        const user = auth.currentUser;

        if (!user) {
          showNotification("You must be logged in to save your profile.");
          return;
        }

        const profile = {
          fullName: document.getElementById("fullName").value,
          email: user.email,
          phone: document.getElementById("phone").value,
          address: document.getElementById("address").value,
        };

        await setDoc(doc(db, "users", user.uid), profile);

        showNotification("Profile saved successfully!");
      };

      // LOAD SAVED PROFILE DATA
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "../index.html";
          return;
        }

        document.getElementById("email").value = user.email;

        await loadOrders(user.uid);

        const profileRef = doc(db, "users", user.uid);

        const profileSnap = await getDoc(profileRef);

        if (profileSnap.exists()) {
          const profile = profileSnap.data();

          document.getElementById("fullName").value = profile.fullName || "";

          document.getElementById("phone").value = profile.phone || "";

          document.getElementById("address").value = profile.address || "";
        }
      });
    </script>

    <script type="module" src="../js/globalSearch.js"></script>

    <div id="notification" class="custom-notification">
      <i class="fa-solid fa-circle-check"></i>
      <span id="notificationText"></span>
    </div>

    <script>
      function showNotification(message) {
        const notification = document.getElementById("notification");
        const notificationText = document.getElementById("notificationText");

        notificationText.textContent = message;

        notification.classList.add("show");

        setTimeout(() => {
          notification.classList.remove("show");
        }, 3000);
      }

      window.showNotification = showNotification;
    </script>

    <script type="module" src="../js/authState.js"></script>
  </body>
</html>
