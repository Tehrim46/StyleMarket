<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | StyleMarket</title>

    <link rel="stylesheet" href="../CSS/styles.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body class="homepage-body">
    <!-- GLOBAL SEARCH PANEL -->

    <div id="searchPanel" class="search-panel">
      <div class="search-header">
        <input id="searchInput" placeholder="Search..." />
        <span class="close-btn" onclick="closeSearch()">×</span>
      </div>

      <div class="recent-searches">
        <div class="recent-header">
          <h4>Recent Searches</h4>
          <button onclick="clearRecentSearches()">Clear All</button>
        </div>
        <div id="recentList"></div>
      </div>

      <div id="searchResults"></div>
    </div>

    <!-- MAIN NAVIGATION BAR -->

    <header>
      <nav class="nav-container">
        <div class="nav-logo">
          <a href="homepage.html">StyleMarket</a>
        </div>

        <!-- CATEGORY NAVIGATION LINKS -->

        <ul class="nav-left">
          <li><a href="women.html">Women</a></li>
          <li><a href="men.html">Men</a></li>
          <li><a href="shoes.html">Shoes</a></li>
          <li><a href="accessories.html">Accessories</a></li>
          <li><a href="sell.html">Sell</a></li>
        </ul>

        <!-- NAVIGATION ICONS -->

        <ul class="nav-right">
          <li class="icon">
            <a href="#" onclick="openSearch()" title="Search">
              <i class="fas fa-search"></i>
            </a>
          </li>

          <li class="icon">
            <a href="account.html" id="accountIcon" title="Account">
              <i class="fas fa-user"></i>
            </a>
          </li>

          <li class="icon">
            <a href="wishlist.html" title="Wishlist">
              <i class="fas fa-heart"></i>
            </a>
          </li>

          <li class="icon">
            <a href="cart.html" class="cart-icon" title="Cart">
              <i class="fas fa-shopping-cart"></i>
              <span id="cartCount" class="cart-count">0</span>
            </a>
          </li>

          <li>
            <a href="../index.html" class="account-btn" id="authBtn">Log In</a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- CART PAGE -->

    <section class="cart-page">
      <div class="cart-header">
        <h1>Your Cart</h1>
        <button class="clear-cart-btn" onclick="clearCart()">Clear All</button>
      </div>

      <div id="cartContainer" class="cart-container"></div>
      <div id="cartSummary" class="cart-summary"></div>
    </section>

    <!-- MAIN FUNCTIONALITY: cart display, quantity control, rewards, and checkout -->

    <script type="module">
      import { auth, db } from "../js/firebase.js";

      import {
        collection,
        getDocs,
        doc,
        setDoc,
        deleteDoc,
        getDoc,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      // CART DATA HANDLING

      async function getCart() {
        const user = auth.currentUser;

        if (!user) return [];

        const snapshot = await getDocs(
          collection(db, "users", user.uid, "cart"),
        );

        const cart = [];

        snapshot.forEach((doc) => {
          cart.push(doc.data());
        });

        return cart;
      }

      async function getReward() {
        const user = auth.currentUser;

        if (!user) return null;

        const rewardRef = doc(db, "users", user.uid, "rewards", "activeReward");
        const rewardSnap = await getDoc(rewardRef);

        if (!rewardSnap.exists()) return null;

        return rewardSnap.data();
      }

      async function updateCartCount() {
        const cartCount = document.getElementById("cartCount");

        if (!cartCount) return;

        const cart = await getCart();

        let totalItems = 0;

        cart.forEach((item) => {
          totalItems += item.quantity || 1;
        });

        cartCount.textContent = totalItems;
      }

      window.updateCartCount = updateCartCount;

      // PRICE HELPER
      // Converts price string into a number for calculations

      function priceToNumber(price) {
        return Number(price.replace("$", ""));
      }

      // CART RENDERING
      // Displays cart items, totals, rewards, and empty-cart state

      const cartContainer = document.getElementById("cartContainer");
      const cartSummary = document.getElementById("cartSummary");

      async function renderCart() {
        const cart = await getCart();

        if (cart.length === 0) {
          document.querySelector(".clear-cart-btn").style.display = "none";
          cartSummary.style.display = "none";

          cartContainer.innerHTML = `
                  <div class="empty-cart">
                    <i class="fa-solid fa-shopping-cart"></i>
                    <p>Your cart is empty.</p>
                    <a href="homepage.html">Continue Shopping</a>
                  </div>
                `;

          cartSummary.innerHTML = "";
          return;
        }

        document.querySelector(".clear-cart-btn").style.display =
          "inline-block";
        cartSummary.style.display = "block";

        cartContainer.innerHTML = cart
          .map(
            (item, index) => `
                  <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">

                    <div class="cart-info">
                      <h3>${item.name}</h3>
                      <p>${item.price}</p>

                      <div class="quantity-controls">
                        <button onclick="changeQuantity(${index}, -1)">−</button>
                        <span>${item.quantity}</span>
                        <button onclick="changeQuantity(${index}, 1)">+</button>
                      </div>
                    </div>

                    <button class="remove-cart-btn" onclick="removeFromCart(${index})">
                      Remove
                    </button>
                  </div>
                `,
          )
          .join("");

        const total = cart.reduce((sum, item) => {
          return sum + priceToNumber(item.price) * item.quantity;
        }, 0);

        const rewardData = await getReward();

        const reward =
          rewardData && rewardData.active === true && rewardData.used !== true
            ? rewardData
            : null;

        const appliedReward = reward && reward.applied === true;

        let discount = 0;
        let finalTotal = total;

        if (appliedReward) {
          discount = total * 0.1;
          finalTotal = total - discount;
        }

        cartSummary.innerHTML = `
                <h2>Order Summary</h2>

                <p>Subtotal: <strong>$${total.toFixed(2)}</strong></p>

                ${
                  reward
                    ? `
                    <div class="reward-box">
                      <p>Reward Available: <strong>${reward.code}</strong></p>
                      ${
                        appliedReward
                          ? `<button onclick="removeReward()" class="reward-btn">Remove Reward</button>`
                          : `<button onclick="applyReward()" class="reward-btn">Apply Reward</button>`
                      }
                    </div>
                  `
                    : ""
                }

                ${
                  appliedReward
                    ? `<p>Discount: <strong>-$${discount.toFixed(2)}</strong></p>`
                    : ""
                }

                <p>Total: <strong>$${finalTotal.toFixed(2)}</strong></p>

                <button class="checkout-btn" onclick="checkoutOrder()">Checkout</button>
              `;
      }

      // QUANTITY CONTROLS
      // Updates item quantity or removes item if it reaches zero

      async function changeQuantity(index, amount) {
        const user = auth.currentUser;

        if (!user) return;

        const cart = await getCart();

        cart[index].quantity += amount;

        if (cart[index].quantity <= 0) {
          await deleteDoc(doc(db, "users", user.uid, "cart", cart[index].id));
        } else {
          await setDoc(
            doc(db, "users", user.uid, "cart", cart[index].id),
            cart[index],
          );
        }

        renderCart();
        updateCartCount();
      }

      // REMOVE ITEM
      // Deletes a single item from the cart

      async function removeFromCart(index) {
        const user = auth.currentUser;

        if (!user) return;

        const cart = await getCart();

        await deleteDoc(doc(db, "users", user.uid, "cart", cart[index].id));

        renderCart();
        updateCartCount();
      }

      // REWARD SYSTEM
      // Applies or removes discount reward

      async function applyReward() {
        const user = auth.currentUser;

        if (!user) return;

        await updateDoc(doc(db, "users", user.uid, "rewards", "activeReward"), {
          applied: true,
        });

        renderCart();
      }

      async function removeReward() {
        const user = auth.currentUser;

        if (!user) return;

        await updateDoc(doc(db, "users", user.uid, "rewards", "activeReward"), {
          applied: false,
        });

        renderCart();
      }

      // CLEAR CART
      // Removes all items from the cart

      async function clearCart() {
        const user = auth.currentUser;

        if (!user) return;

        const cart = await getCart();

        for (const item of cart) {
          await deleteDoc(doc(db, "users", user.uid, "cart", item.id));
        }

        renderCart();
        updateCartCount();
      }

      // CHECKOUT PROCESS
      // Saves order and redirects user to account page

      async function checkoutOrder() {
        const cart = await getCart();

        if (cart.length === 0) {
          showNotification("Your cart is empty.");
          return;
        }

        const rewardData = await getReward();

        const reward =
          rewardData && rewardData.active === true && rewardData.used !== true
            ? rewardData
            : null;

        const appliedReward = reward && reward.applied === true;

        const subtotal = cart.reduce((sum, item) => {
          return sum + priceToNumber(item.price) * item.quantity;
        }, 0);

        const discount = appliedReward ? subtotal * 0.1 : 0;
        const finalTotal = subtotal - discount;

        const pendingOrder = {
          date: new Date().toLocaleDateString(),
          subtotal: subtotal.toFixed(2),
          discount: discount.toFixed(2),
          total: finalTotal.toFixed(2),
          items: cart,
          rewardUsed: appliedReward,
        };

        const user = auth.currentUser;

        await setDoc(
          doc(db, "users", user.uid, "checkout", "pendingOrder"),
          pendingOrder,
        );

        console.log("Reward Applied:", appliedReward);

        const response = await fetch(
          "http://localhost:4242/create-checkout-session",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              cart: cart,
              appliedReward: appliedReward,
              finalTotal: finalTotal,
              origin: window.location.origin,
            }),
          },
        );

        const data = await response.json();

        if (data.url) {
          window.location.href = data.url;
        } else {
          showNotification("Stripe checkout failed.");
        }
      }

      auth.onAuthStateChanged((user) => {
        if (user) {
          renderCart();
          updateCartCount();
        }
      });

      window.checkoutOrder = checkoutOrder;
      window.clearCart = clearCart;
      window.removeFromCart = removeFromCart;
      window.changeQuantity = changeQuantity;
      window.applyReward = applyReward;
      window.removeReward = removeReward;
    </script>

    <script src="../js/products.js"></script>
    <script type="module" src="../js/globalSearch.js"></script>

    <div id="notification" class="custom-notification">
      <i class="fa-solid fa-circle-check"></i>
      <span id="notificationText"></span>
    </div>

    <script>
      function showNotification(message) {
        const notification = document.getElementById("notification");
        const notificationText = document.getElementById("notificationText");

        notificationText.textContent = message;

        notification.classList.add("show");

        setTimeout(() => {
          notification.classList.remove("show");
        }, 3000);
      }

      window.showNotification = showNotification;
    </script>

    <script type="module" src="../js/authState.js"></script>
  </body>
</html>
