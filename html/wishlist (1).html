<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist | StyleMarket</title>

    <link rel="stylesheet" href="../CSS/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body class="homepage-body">
    <!-- NAVIGATION BAR -->
    <header>
      <nav class="nav-container">
        <div class="nav-logo">
          <a href="homepage.html">StyleMarket</a>
        </div>

        <ul class="nav-left">
          <li><a href="homepage.html">Home</a></li>
          <li><a href="wishlist.html">Wishlist</a></li>
        </ul>

        <ul class="nav-right">
          <li class="icon">
            <a href="wishlist.html"><i class="fa-regular fa-heart"></i></a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- WISHLIST DISPLAY SECTION -->
    <section class="featured-products">
      <h2>My Wishlist</h2>

      <!-- WISHLIST ITEMS -->
      <div id="wishlist-container" class="product-grid"></div>

      <!-- MESSAGE WHEN WISHLIST IS EMPTY -->
      <p id="empty-message" class="wishlist-empty">Your wishlist is empty.</p>
    </section>

    <!-- WISHLIST FUNCTIONALITY (LOCAL STORAGE) -->
    <script>
      const wishlistContainer = document.getElementById("wishlist-container");
      const emptyMessage = document.getElementById("empty-message");

      // Load wishlist from browser storage
      let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

      // Display wishlist items on page
      function renderWishlist() {
        wishlistContainer.innerHTML = "";

        if (wishlist.length === 0) {
          emptyMessage.style.display = "block";
          return;
        }

        emptyMessage.style.display = "none";

        wishlist.forEach((item, index) => {
          wishlistContainer.innerHTML += `
          <div class="product-card">
            <img src="${item.image}" class="product-img" alt="${item.name}">
            <h3>${item.name}</h3>
            <p>${item.price}</p>
            <button class="remove-btn" onclick="removeFromWishlist(${index})">Remove</button>
          </div>
        `;
        });
      }

      // Remove item from wishlist
      function removeFromWishlist(index) {
        wishlist.splice(index, 1);
        localStorage.setItem("wishlist", JSON.stringify(wishlist));
        renderWishlist();
      }

      renderWishlist();
    </script>
  </body>
</html>
