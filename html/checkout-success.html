<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Payment Successful | StyleMarket</title>
    <link rel="stylesheet" href="../CSS/styles.css" />
  </head>

  <body class="homepage-body">
    <div class="success-page">
      <h1>Payment Successful!</h1>
      <p>Saving your order...</p>
    </div>

    <script type="module">
      import { auth, db } from "../js/firebase.js";

      import {
        collection,
        addDoc,
        doc,
        updateDoc,
        getDocs,
        deleteDoc,
        getDoc,
        setDoc,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      let pendingOrder = null;

      //saveOrder
      async function saveOrder(user) {
        if (!user) {
          showNotification("You must be logged in.");
          window.location.href = "../index.html";
          return;
        }

        const pendingRef = doc(
          db,
          "users",
          user.uid,
          "checkout",
          "pendingOrder",
        );
        const pendingSnap = await getDoc(pendingRef);

        if (!pendingSnap.exists()) {
          showNotification("No pending order found.");
          window.location.href = "cart.html";
          return;
        }

        pendingOrder = pendingSnap.data();

        await addDoc(collection(db, "users", user.uid, "orders"), pendingOrder);

        const cartSnapshot = await getDocs(
          collection(db, "users", user.uid, "cart"),
        );

        for (const cartItem of cartSnapshot.docs) {
          await deleteDoc(doc(db, "users", user.uid, "cart", cartItem.id));
        }

        await deleteDoc(doc(db, "users", user.uid, "checkout", "pendingOrder"));

        if (pendingOrder.rewardUsed) {
          await updateDoc(
            doc(db, "users", user.uid, "rewards", "activeReward"),
            {
              active: false,
              used: true,
              applied: false,
              usedAt: new Date().toLocaleDateString(),
            },
          );
        }

        window.location.href = "account.html";
      }

      onAuthStateChanged(auth, (user) => {
        saveOrder(user);
      });
    </script>

    <div id="notification" class="custom-notification">
      <i class="fa-solid fa-circle-check"></i>
      <span id="notificationText"></span>
    </div>

    <script>
      function showNotification(message) {
        const notification = document.getElementById("notification");
        const notificationText = document.getElementById("notificationText");

        notificationText.textContent = message;

        notification.classList.add("show");

        setTimeout(() => {
          notification.classList.remove("show");
        }, 3000);
      }

      window.showNotification = showNotification;
    </script>
  </body>
</html>
